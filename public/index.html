<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tow Scout</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css"></head><body>
<header><b>🚩 Tow Scout</b><span id="who"></span>
<span id="legend" class="hidden"></span><button id="gng" class="hidden ok">🪝 Grab&amp;Go</button><button id="bell" class="hidden">🔔<span id="badge">0</span></button><button id="switch">Switch</button></header>
<div id="main"><div id="map"></div>
<aside id="side"><div id="disp" class="hidden"><h3>📞 Dispatch a tow</h3>
<input id="dstreet" placeholder="Street (e.g. 100 NW 1st Ave)" autocomplete="address-line1"><div class="addr"><input id="dcity" placeholder="City" autocomplete="address-level2"><input id="dstate" placeholder="State" maxlength="20" autocomplete="address-level1"><input id="dzip" placeholder="Zip" inputmode="numeric" maxlength="10" autocomplete="postal-code"></div><button id="dfind" style="width:100%">🔎 Find address</button><small>No city/state? Searches nearest to the map view.</small>
<div id="dres"></div><small id="dloc">Find an address or tap the map.</small>
<input id="dname" placeholder="Contact name (optional)"><input id="dphone" type="tel" placeholder="Phone (optional)">
<textarea id="dnotes" placeholder="Notes: vehicle, plate, gate code…"></textarea>
<button id="dsend" class="driver" style="width:100%">Send to drivers</button><hr></div><h3><span id="ltitle">Open spots</span> (<span id="count">0</span>)</h3><div id="list"></div></aside></div>
<div id="mgr" class="hidden"><div class="row" style="margin:0 0 6px"><h2 style="flex:1;margin:0">Manager dashboard</h2><button id="mgrref">↻ Refresh</button></div><div id="mtabs" class="row" style="margin:0 0 8px"><button data-t="stats" class="on" onclick="mtab('stats')">📊 Stats</button><button data-t="marks" onclick="mtab('marks')">🚩 Marks</button><button data-t="sess" onclick="mtab('sess')">🕒 Logins</button></div><div id="mgrbody">Loading…</div><div id="mmarks" class="hidden"></div><div id="mdetail" class="hidden"></div><div id="msess" class="hidden"></div></div>
<div id="hint"></div>
<div id="login" class="modal"><div class="card"><h2>Welcome</h2>
<input id="name" placeholder="Your display name"><div class="row">
<button data-role="scout" class="scout">I'm a Scout</button><button data-role="driver" class="driver">I'm a Tow Driver</button></div><div class="row"><button data-role="manager" class="manager">I'm a Manager</button><button data-role="dispatch" class="dispatch">I'm Dispatch</button></div></div></div>
<div id="form" class="modal hidden"><div class="card"><h2>Report vehicle</h2><p id="loc"></p>
<textarea id="notes" placeholder="Notes (plate, color, make…) optional"></textarea>
<label class="file">📷 Add photos (up to 5)<input id="photos" type="file" accept="image/*" multiple></label>
<div id="previews"></div><div class="row"><button id="cancel">Cancel</button><button id="submit" class="driver">Send to drivers</button></div></div></div>
<div id="notifs" class="modal hidden"><div class="card"><h2>Alerts</h2><div id="nlist"></div>
<div class="row"><button id="nclear">Clear</button><button id="nclose">Close</button></div></div></div>
<div id="lightbox" class="modal hidden"><img></div>
<div id="dbox" class="hidden"><div><span class="lab">D</span><b>🟢<i id="dbd">0</i> 🟡<i id="dbb">0</i></b><span>online · busy</span></div><div><span class="lab">S</span><b>🟢<i id="dbs">0</i></b><span>roaming</span></div></div>
<div id="toasts"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/socket.io/socket.io.js"></script><script src="app.js"></script>
</body></html>
